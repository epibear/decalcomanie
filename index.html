        const r = traceFlight(S, plan, { x: plan.x + wv.x * DRIFT * d, z: plan.z + wv.z * DRIFT * d }, d).blocked;
        me.pos = keep; return r;
      };
      for (let i = 0; i < 14 && blockedAt(spot); i++)
        spot = landAt ? clampMove(me, { x: me.moveFrom.x + rand(-moveR(), moveR()), z: me.moveFrom.z + rand(-moveR(), moveR()) })
          : aiChooseSpot(me, foe);
    }
    if (Math.hypot(spot.x - me.pos.x, spot.z - me.pos.z) > 0.3) {
      sfx.hop();
      await hopTo(me, spot);
      if (id !== game) return;
    }
  }
  const plan = landAt ? aimFor(me, landAt) : aiPlan(me, foe);
  // 조준점이 이리저리 흔들리다 목표로 수렴 (고민하는 연출)
  const from = clampAim({
    x: (me.pos.x + plan.x) / 2 + rand(-1.5, 1.5), z: (me.pos.z + plan.z) / 2 + rand(-1.5, 1.5),
  }, me.zone);
  const p1 = rand(0, 6), p2 = rand(0, 6);
  await tween(rand(1100, 1800), k => {
    const w = (1 - k) * 0.6;
    aiAim = clampAim({
      x: from.x + (plan.x - from.x) * k + Math.sin(k * 9 + p1) * w,
      z: from.z + (plan.z - from.z) * k + Math.cos(k * 7 + p2) * w,
    }, me.zone);
  }, ease.outCubic);
  if (id !== game) return;
  aiAim = { ...plan };
  await wait(350);
  if (id !== game) return;
  const shot = computeShot(me, foe, plan);
  if (MODE === 'hide') hideAILearn(shot);   // AI도 받은 힌트로만 추측을 갱신
  fire(shot);
}

// w = 이긴 쪽, -1 = 무승부
function gameOver(w) {
  phase = 'over';
  const draw = w < 0;
  if (!draw) { turn = w; players[w].winner = true; }
  players.forEach(p => { p.ring.visible = false; });
  sfx.win();
  const c = draw ? { x: 0, z: 0 } : players[w].pos;
  for (let i = 0; i < 160; i++) {
    const m = addT(new THREE.Mesh(new THREE.PlaneGeometry(0.14, 0.22), new THREE.MeshBasicMaterial({
      color: new THREE.Color().setHSL(Math.random(), 0.85, 0.6), side: THREE.DoubleSide,
    })));
    m.position.set(c.x + rand(-0.5, 0.5), 2.5 + terrainH(c.x, c.z), c.z + rand(-0.5, 0.5));
    m.userData = {
      v: new THREE.Vector3(rand(-4, 4), rand(5, 10), rand(-4, 4)),
      r: new THREE.Vector3(rand(-9, 9), rand(-9, 9), rand(-9, 9)), t0: performance.now(),
    };
    confetti.push(m);
  }
  updateHud();
  setTimeout(() => {
    if (phase !== 'over') return;
    $('overText').textContent = draw ? '무승부!' : isOnline() ? (w === net.me ? '승리!' : '패배…')
      : settings.opp !== 'ai' ? `${NAMES[w]} 승리!` : w === 0 ? '승리!' : 'AI 승리…';
    $('overText').style.color = draw ? 'var(--ink)' : CSS_COLORS[w];
    if (MODE === 'dice') {
      const sub = document.createElement('div');
      sub.style.fontSize = '22px';
      sub.textContent = `A ${dice.count[0]}칸 · B ${dice.count[1]}칸`;
      $('overText').appendChild(sub);
    }
    if (MODE === 'sign') {
      // 실수(메인) · 발사 수 · 클리어 시간(시작 신호부터 마지막 표지판을 맞힌 때까지)을 모두 보여줌
      const sub = document.createElement('div'), names = playerNames();
      sub.style.cssText = 'font-size:20px;line-height:1.6;white-space:pre-line;color:var(--ink);-webkit-text-stroke:0';
      sub.textContent = [0, 1].map(i => `${names[i]}: ${sign.idx[i]}/${sign.n}개 · 실수 ${sign.miss[i]} · 발사 ${sign.shots[i]}발 · ${sign.idx[i] >= sign.n ? (sign.fin[i] / 1000).toFixed(1) + '초' : '미완주'}`).join('\n');
      $('overText').appendChild(sub);
    }
    $('over').hidden = false;
  }, 1400);
}

function clearWorld() {
  tweens.length = 0;
  for (const o of transient) scene.remove(o);
  transient.clear();
  players.forEach(p => scene.remove(p.root));
  marks.forEach(m => scene.remove(m));
  marks = []; drops = []; confetti = [];
  floaters.forEach(f => f.el.remove()); floaters = [];
  $('over').hidden = true;
  $('banner').classList.remove('show');
}

// 설정값을 판/판정/카메라에 반영
function applySettings() {
  ({ w: BW, d: BD } = CFG.map[settings.map]);
  ({ core: HIT_CORE, edge: HIT_EDGE } = CFG.bomb[settings.bomb]);
  MODE = settings.mode;
  axis = MODE === 'sign' ? 'h' : settings.axis;   // 레이스는 늘 가로 접는 선 (두 사람이 아래쪽에 나란히)
  windsock.root.position.z = -BD / 2 - 1.4;
  // 조준 원 = 찍히는 크기 (오목은 돌, 땅따먹기는 주사위 칸)
  const R = MODE === 'omok' ? 0.35 * CFG.omok.gap[settings.bomb] : MODE === 'dice' ? 0.5 * CFG.dice.cell[settings.bomb]
    : MODE === 'sign' || MODE === 'hide' ? HIT_EDGE : HIT_CORE;
  ringMesh.geometry.dispose();
  ringMesh.geometry = new THREE.RingGeometry(Math.max(0.05, R - 0.08), R, 40);
  ticks.forEach((t, i) => {
    const a = i * Math.PI / 2;
    t.position.set(Math.cos(a) * (R + 0.12), 0, Math.sin(a) * (R + 0.12));
  });
  fitCamera();
}

// start = 온라인 참가자가 방장에게 받은 시작 정보 { s: 판 설정, pos: 시작 위치 }
async function newGame(start) {
  await Promise.race([charModelsReady, new Promise(r => setTimeout(r, 8000))]);   // 물감이 모델 로딩 (늦으면 도형 캐릭터)
  const id = ++game;
  netResetInbox();
  clearWorld();
  if (start) Object.assign(settings, start.s, { opp: 'online' });
  applySettings();
  aiAim = null; remoteAim = null;
  setTerrain([]);   // 늘 평지 (언덕·산은 접히는 구간이 어색해서 뺌)
  buildBoard();
  if (MODE === 'omok') setupOmok();
  if (MODE === 'dice') setupDice();
  paints.length = 0; hideLast[0] = hideLast[1] = null; hideShots = [0, 0];
  if (MODE === 'hide') hideAIInit();
  if (MODE === 'sign') setupSign(start?.sign ?? genSign());   // 온라인 참가자는 방장이 보낸 표지판·바람을 그대로 씀
  dragging = null;
  const moveTip = moveMode() === 'manual' ? '내 캐릭터를 끌면 이동, ' : '';
  $('help').textContent = MODE === 'hide'
    ? `상대는 안 보여요! ${moveTip}내 구역에 쏘면 대칭 자리에 찍히고, 그 자리에서 상대가 있는 쪽(↑↓←→)을 알려줘요. 가까우면 ?(근처), 맞히면 피해. 물감 위로는 못 가요. 체력을 먼저 다 깎으면 승리.`
    : MODE === 'sign'
    ? `둘이 동시에 달려요! ${moveTip}내 레인 아래쪽에 쏘면 접는 선 건너편 대칭 자리에 찍혀요. 맞은편 내 표지판의 동그라미 안에 찍으면 명중 → 다음 표지판! 바람은 ${CFG.sign.windSec}초마다 바뀌고 둘이 똑같아요. 빗맞힘이 적은 쪽이 승리(같으면 먼저 끝낸 쪽).`
    : MODE === 'omok'
    ? `${moveTip}종이 아무 데나 쏘면 접는 선 건너편 대칭 자리에 내 돌이 찍혀요. 상대 돌에 찍히면 섞여서 탁한 돌! 5목을 먼저 만들면 승리.`
    : MODE === 'dice'
    ? `${moveTip}내 구역에 주사위를 던지면 접는 선 건너편 대칭 칸으로 넘어가 나온 눈 수만큼 전개도가 펼쳐져요(1 = 면 1개 … 6 = 6개). 이미 찬 칸에는 못 펼쳐서, 빈 칸이 모자라면 그 주사위는 무효! 상대 캐릭터 정타면 무조건 6. ${CFG.dice.shots}개씩 던지고 칸 많은 쪽 승리.`
    : moveMode() === 'manual'
    ? '내 캐릭터를 끌면 이동(원 안), 내 구역 빈 곳을 클릭하면 발사! 이동은 안 해도 돼요. 멀리 쏠수록 바람을 더 타요.'
    : '내 구역을 클릭해서 물감총 발사! 바람에 밀린 자리가 접혀서 상대 구역에 찍혀요. 멀리 쏠수록 바람을 더 타요.';
  players = [makeChar(0), makeChar(1)];
  players.forEach(p => {
    p.pos = start ? { ...start.pos[p.zone] } : MODE === 'sign' ? laneSpot(p.zone) : randomSpot(p.zone);
    p.hopY = 9;
    if (MODE === 'sign') p.faceTarget = p.rig.rotation.y = Math.PI;   // 표지판(위쪽)을 바라봄
  });
  if (isOnline() && net.host) {
    const { mode, bomb, wind: w, map, terrain: tr, axis: ax, move, signs } = settings;
    netSend({ t: 'start', s: { mode, bomb, wind: w, map, terrain: tr, axis: ax, move, signs }, pos: players.map(p => p.pos), terrain,
      sign: MODE === 'sign' ? { pts: sign.pts, winds: sign.winds } : null });
  }
  turn = 0; wind.str = 0; phase = 'intro';
  updateHud();
  await Promise.all(players.map((p, i) => dropIn(p, 200 + i * 220)));
  if (id !== game) return;
  if (MODE === 'sign') raceStart(id); else beginTurn(id, false);
}

// ================= 조준 =================
const aimGroup = new THREE.Group();
scene.add(aimGroup);
const reticleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, depthWrite: false, depthTest: false });
const reticle = new THREE.Group();
const ringMesh = new THREE.Mesh(new THREE.RingGeometry(HIT_CORE - 0.08, HIT_CORE, 40), reticleMat);
ringMesh.rotation.x = -Math.PI / 2; reticle.add(ringMesh);
const ticks = [];
for (let i = 0; i < 4; i++) {
  const t = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.22), reticleMat);
  t.rotation.x = -Math.PI / 2;
  const a = i * Math.PI / 2;
  t.position.set(Math.cos(a) * (HIT_CORE + 0.12), 0, Math.sin(a) * (HIT_CORE + 0.12));
  t.rotation.z = a + Math.PI / 2;
  reticle.add(t); ticks.push(t);
}
const dotMesh = new THREE.Mesh(new THREE.CircleGeometry(0.06, 16), reticleMat);
dotMesh.rotation.x = -Math.PI / 2; reticle.add(dotMesh);
aimGroup.add(reticle);

const ARC_N = 32;
const arcGeo = new THREE.BufferGeometry();
arcGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array((ARC_N + 1) * 3), 3));
const arcLine = new THREE.Line(arcGeo, new THREE.LineDashedMaterial({
  color: 0x2b2b2b, dashSize: 0.22, gapSize: 0.16, transparent: true, opacity: 0.75,
}));
aimGroup.add(arcLine);
aimGroup.visible = false;

let aim = null, pressing = false;
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitV = new THREE.Vector3();

function pointerToGround(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camBaseCam);
  // 언덕이 있으면 눈에 보이는 언덕 표면을 짚음 (평면 y=0과 어긋나므로)
  if (terrain.length) {
    const hit = raycaster.intersectObjects(terrainMeshes)[0];
    if (hit) return { x: hit.point.x, z: hit.point.z };
  }
  return raycaster.ray.intersectPlane(groundPlane, hitV) ? { x: hitV.x, z: hitV.z } : null;
}

function updateAim(now) {
  const me = players[turn];
  const a = phase === 'aim' && !dragging && !hoverChar ? aim : phase === 'ai' ? aiAim : phase === 'remote' ? remoteAim : null;
  const ok = me && canAim(a) && !hiddenFrom(me);   // 숨바꼭질: 상대 조준점은 위치를 알려주니 안 보여줌
  aimGroup.visible = !!ok;
  if (!ok) return;
  me.faceTarget = Math.atan2(a.x - me.pos.x, a.z - me.pos.z);
  reticleMat.color.setHex(COLORS[turn]);
  const ah = terrainH(a.x, a.z);
  reticle.position.set(a.x, ah + 0.05, a.z);
  reticle.rotation.y = now * 0.0015;
  const S = gunTip(me), d = Math.hypot(a.x - S.x, a.z - S.z), arcH = arcOf(d);
  // 언덕에 걸릴 것 같으면 점선이 거기서 끊기고 조준 원이 흐려짐 (바람은 미리 안 보여줌)
  const tr = traceFlight(S, a, a, d), none = { x: 0, z: 0 };
  reticleMat.opacity = tr.blocked ? 0.4 : 0.95;
  const pos = arcGeo.attributes.position;
  for (let i = 0; i <= ARC_N; i++) {
    const p = flightAt(S, a, none, arcH, ah, tr.k * i / ARC_N);
    pos.setXYZ(i, p.x, p.y, p.z);
  }
  pos.needsUpdate = true;
  arcGeo.computeBoundingSphere();
  arcLine.computeLineDistances();
}

// 내 캐릭터를 눌렀는지: 몸통에 맞았거나 발밑 근처
let dragging = null;   // { off } = 잡은 지점과 캐릭터 발 위치의 차이
function onOwnChar(e) {
  const me = players[turn];
  if (!me) return false;
  const g = pointerToGround(e);   // raycaster도 이 포인터로 맞춰짐
  if (raycaster.intersectObject(me.rig, true).length) return true;
  return !!g && Math.hypot(g.x - me.pos.x, g.z - me.pos.z) < 0.8;
}

canvas.addEventListener('pointermove', e => {
  aim = pointerToGround(e);
  if (dragging) {
    const me = players[turn];
    if (aim) me.pos = clampMove(me, { x: aim.x + dragging.off.x, z: aim.z + dragging.off.z });
  } else {
    hoverChar = canMove() && onOwnChar(e);
    canvas.style.cursor = hoverChar ? 'grab' : 'crosshair';
  }
});
canvas.addEventListener('pointerdown', e => {
  sfx.unlock();
  aim = pointerToGround(e);
  canvas.setPointerCapture(e.pointerId);
  if (canMove() && aim && onOwnChar(e)) {
    // 캐릭터를 잡으면 끌어서 이동 (놓으면 끝, 바로 발사 가능)
    const me = players[turn];
    dragging = { off: { x: me.pos.x - aim.x, z: me.pos.z - aim.z } };
    me.hopY = 0.35; me.sq = 1.08;
    canvas.style.cursor = 'grabbing';
    sfx.hop();
    return;
  }
  pressing = true;
});
canvas.addEventListener('pointerup', e => {
  aim = pointerToGround(e);
  if (dragging) {
    const me = players[turn];
    dragging = null;
    tween(320, k => { me.hopY = 0.35 * (1 - k); me.sq = 1 - 0.2 * Math.sin(k * Math.PI); });
    canvas.style.cursor = 'grab';
    if (isOnline()) netSend({ t: 'move', p: { ...me.pos } });   // 최종 위치는 바로 전송
    return;
  }
  if (pressing && phase === 'aim' && canAim(aim)) shoot({ ...aim });
  pressing = false;
});
canvas.addEventListener('pointerleave', () => { if (!pressing) aim = null; hoverChar = false; });

// ================= 카메라 =================
const VIEWS = {
  tilt: { pos: new THREE.Vector3(0, 12.5, 11.5), look: new THREE.Vector3(0, 0, 0.4) },
  top: { pos: new THREE.Vector3(0, 19, 0.001), look: new THREE.Vector3(0, 0, 0) },
};
const camBaseCam = camera.clone();
function fitCamera() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const v = VIEWS[view];
  const dir = v.pos.clone().sub(v.look);
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  // 기울여 보기에선 판 앞쪽 가장자리가 가까워 더 넓게 보이므로 판 깊이만큼 여유를 더 줌
  const nearWiden = view === 'tilt' ? 1 + BD * 0.022 : 1;
  const needW = (BW + 2.5) * nearWiden / (2 * t * camera.aspect);
  const needH = (view === 'top' ? BD + 7 : BD * 0.8 + 5) / (2 * t);
  const D = Math.max(dir.length(), needW, needH);
  camera.position.copy(v.look).addScaledVector(dir.normalize(), D);
  camera.lookAt(v.look);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  camBaseCam.copy(camera);
}
addEventListener('resize', fitCamera);

// ================= 버튼 =================
// 온라인: 판을 새로 까는 건 방장만. 참가자는 방장에게 요청
function restart() {
  sfx.unlock();
  if (!isOnline()) return newGame();
  if (!net.conn) return openMenu();          // 친구가 나간 상태 → 설정 화면에서 다시 연결
  if (net.host) newGame(); else netSend({ t: 'again' });
}
$('restartBtn').onclick = restart;
$('againBtn').onclick = restart;

// ================= 온라인 대전 (PeerJS) =================
// 방 코드 = PeerJS 아이디 뒷부분. 방장 브라우저가 이 아이디로 등록하고, 참가자가 이 아이디로 접속
const PEER_PREFIX = 'decalcomanie-v1-';
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const makeCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.random() * CODE_CHARS.length | 0]).join('');

let inbox = [], waiters = [];
function netResetInbox() { inbox = []; waiters = []; }   // 이전 판을 기다리던 흐름은 그대로 버려짐
function netWait(t) {
  const i = inbox.findIndex(m => m.t === t);
  if (i >= 0) return Promise.resolve(inbox.splice(i, 1)[0]);
  return new Promise(r => waiters.push({ t, r }));
}
function netSend(m) { if (net.conn?.open) net.conn.send(m); }

function netStatus(text, err = false) {
  $('netStatus').textContent = text;
  $('netStatus').classList.toggle('err', err);
}
function showLink(code) {
  $('linkRow').hidden = !code;
  if (code) $('linkIn').value = `${location.origin}${location.pathname}?room=${code}`;
}

function netClose() {
  const peer = net.peer;
  net.peer = net.conn = null; net.code = '';
  if (peer) peer.destroy();
  showLink('');
}

function peerReady() {
  if (typeof Peer !== 'undefined') return true;
  netStatus('온라인 모듈을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.', true);
  return false;
}

function netHost(tries = 0) {
  if (!peerReady()) return;
  netClose();
  const code = makeCode();
  const peer = net.peer = new Peer(PEER_PREFIX + code);
  netStatus('방 만드는 중…');
  peer.on('open', () => {
    if (net.peer !== peer) return;
    net.code = code; net.host = true; net.me = 0;
    $('codeIn').value = code;
    showLink(code);
    netStatus(`방 코드 ${code} · 링크를 친구에게 보내고 기다려 주세요`);
  });
  peer.on('connection', c => {
    if (net.peer !== peer || net.conn) { c.on('open', () => c.close()); return; }  // 이미 대전 중이면 거절
    bindConn(c);
  });
  peer.on('error', e => {
    if (net.peer !== peer) return;
    if (e.type === 'unavailable-id' && tries < 3) return netHost(tries + 1);   // 코드가 겹치면 새로 뽑기
    netStatus(`연결 오류 (${e.type})`, true);
  });
}

function netJoin(code) {
  code = code.trim().toUpperCase();
  if (!code) return netStatus('방 코드를 입력해 주세요', true);
  if (!peerReady()) return;
  netClose();
  const peer = net.peer = new Peer();
  net.host = false; net.me = 1;
  netStatus(`방 ${code}에 연결 중…`);
  peer.on('open', () => {
    if (net.peer !== peer) return;
    bindConn(peer.connect(PEER_PREFIX + code, { reliable: true }));
  });
  peer.on('error', e => {
    if (net.peer !== peer) return;
    netStatus(e.type === 'peer-unavailable' ? '방을 찾을 수 없어요. 코드를 확인하거나 방장에게 새 링크를 받아 주세요'
      : `연결 오류 (${e.type})`, true);
  });
}

function bindConn(c) {
  c.on('open', () => {
    net.conn = c;
    if (net.host) {
      netStatus('친구가 들어왔어요! 시작합니다');
      // 설정 화면에서 고르던 판 설정으로 시작
      if (menuOpen) Object.assign(settings, draft);
      settings.opp = 'online';
      try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
      closeMenu();
      newGame();
    } else netStatus('연결됐어요! 방장이 판을 까는 중…');
  });
  c.on('data', onNet);
  c.on('close', () => onNetClose(c));
  c.on('error', () => onNetClose(c));
}

function onNet(m) {
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'start':                               // 참가자: 방장이 새 판을 깔았음
      if (net.host) return;
      closeMenu();
      newGame(m);
      break;
    case 'again':                               // 방장: 참가자가 한 판 더 요청
      if (net.host) newGame();
      break;
    case 'move':                                // 친구가 캐릭터를 끄는 중
      if (phase === 'remote') players[turn].netPos = m.p;
      else if (MODE === 'sign' && players[1 - turn]) players[1 - turn].netPos = m.p;   // 레이스: turn = 내 번호
      break;
    case 'aim':                                 // 친구의 조준점
      if (phase === 'remote') remoteAim = m.p;
      break;
    case 'bye':                                 // 친구가 창을 닫음 (WebRTC 끊김 감지는 몇 초 걸려서 먼저 알려줌)
      if (net.conn) { const c = net.conn; onNetClose(c); c.close(); }
      break;
    case 'turn': case 'fire': {
      if (MODE === 'sign' && m.t === 'fire') {   // 레이스: 차례가 없어서 받는 즉시 상대 레인에서 재생
        if (m.shot && phase !== 'over' && phase !== 'menu') raceFire(1 - turn, m.shot);
        break;
      }
      const i = waiters.findIndex(w => w.t === m.t);
      if (i >= 0) waiters.splice(i, 1)[0].r(m); else inbox.push(m);
      break;
    }
  }
}

function onNetClose(c) {
  if (net.conn !== c) return;
  net.conn = null;
  if (!isOnline()) return;
  if (phase !== 'over' && phase !== 'menu') {    // 승부가 이미 났으면 결과 화면은 그대로 둠
    game++;                                      // 진행 중이던 턴 흐름 중단
    phase = 'over';
    players.forEach(p => { p.ring.visible = false; });
    updateHud();
    $('overText').textContent = '친구와 연결이 끊겼어요';
    $('overText').style.color = 'var(--ink)';
    $('over').hidden = menuOpen;
  }
  $('turnText').textContent = '연결 끊김';
  netStatus(net.host && net.peer ? `친구가 나갔어요. 같은 링크로 다시 들어오면 바로 이어서 시작해요 (방 ${net.code})`
    : '연결이 끊겼어요. 다시 참가해 주세요', !net.host);
}

// 내 차례에 끄는 위치·조준점을 친구 화면에 실시간 전송 (초당 약 15번, 바뀔 때만)
let netLastT = 0, netLastKey = '';
function netTick(now) {
  if (!isOnline() || !net.conn || phase !== 'aim' || isRemote(turn) || now - netLastT < 66) return;
  const me = players[turn];
  const a = !dragging && !hoverChar && canAim(aim) ? { x: +aim.x.toFixed(3), z: +aim.z.toFixed(3) } : null;
  const m = dragging ? { t: 'move', p: { ...me.pos } } : MODE === 'sign' ? null : { t: 'aim', p: a };   // 레이스는 조준점을 안 보냄
  if (!m) return;
  const key = JSON.stringify(m);
  if (key === netLastKey) return;
  netLastT = now; netLastKey = key;
  netSend(m);
}

addEventListener('pagehide', () => { netSend({ t: 'bye' }); });
$('hostBtn').onclick = () => { sfx.unlock(); netHost(); };
$('joinBtn').onclick = () => { sfx.unlock(); netJoin($('codeIn').value); };
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText($('linkIn').value); $('copyBtn').textContent = '복사됨!'; }
  catch { $('linkIn').select(); document.execCommand('copy'); $('copyBtn').textContent = '복사됨!'; }
  setTimeout(() => { $('copyBtn').textContent = '복사'; }, 1500);
};

// ================= 설정 메뉴 =================
let menuOpen = false;
let draft = { ...settings };   // 메뉴에서 고치는 사본 — 시작! 때만 반영
const gameActive = () => players.length > 0 && phase !== 'over' && phase !== 'menu';

function renderMenu() {
  document.querySelectorAll('#menu .seg[data-key]').forEach(seg => {
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === draft[seg.dataset.key]));
  });
  $('aiRow').querySelector('.seg').classList.toggle('disabled', draft.opp !== 'ai');
  $('aiHint').textContent = draft.opp === 'ai' ? CFG.ai[draft.ai].hint
    : draft.opp === 'online' ? '방을 만들고 링크를 보내면 친구가 들어오는 순간 시작해요 · 판 설정은 방장 기준'
    : '한 화면에서 번갈아 쏴요';
  $('onlineBox').hidden = draft.opp !== 'online';
  $('startBtn').hidden = draft.opp === 'online';
  document.querySelectorAll('#presetSeg button').forEach(b => {
    const q = QUICK[b.dataset.p];
    b.classList.toggle('on', q.bomb === draft.bomb && q.wind === draft.wind && q.map === draft.map && q.terrain === draft.terrain);
  });
  const B = CFG.bomb[draft.bomb], Wd = CFG.wind[draft.wind], Mp = CFG.map[draft.map];
  $('modeHint').textContent = MODES[draft.mode].hint;
  $('bombHint').textContent = draft.mode === 'omok' ? `칸 간격 ${CFG.omok.gap[draft.bomb]}m · 작을수록 정확히 쏴야 해요`
    : draft.mode === 'dice' ? `칸(주사위 면) 크기 ${CFG.dice.cell[draft.bomb]}m · 캐릭터 정타 판정 ${B.core}m`
    : draft.mode === 'sign' ? `표지판 명중 반경 ${B.edge}m · 작을수록 정확히 쏴야 해요`
    : draft.mode === 'hide' ? `정타 ${B.core}m · 스침 ${B.edge}m · '?' 범위 ${(B.edge * CFG.hide.qMul).toFixed(1)}m`
    : `정타 반경 ${B.core}m · 스침 반경 ${B.edge}m`;
  $('windHint').textContent = draft.mode === 'sign' ? `${CFG.sign.windSec}초마다 바뀌는 바람 · 두 사람에게 똑같이 적용`
    : Wd.max ? `매 턴 ${Wd.min}~${Wd.max}단계 · 멀리 쏠수록 더 밀려요` : '바람이 불지 않아요';
  $('moveHint').textContent = draft.mode === 'hide'
    ? `직접 이동만 · 한 턴 최대 ${+(Mp.move * CFG.hide.moveMul).toFixed(2)}m · 물감 위로는 못 가요`
    : draft.move === 'manual'
    ? `캐릭터를 끌어서 이동(한 턴 최대 ${Mp.move}m), 빈 곳 클릭으로 발사`
    : '매 턴 두 캐릭터가 랜덤한 자리로 폴짝 이동해요';
  $('signRow').hidden = draft.mode !== 'sign';
  document.querySelector('#menu .seg[data-key="terrain"]').closest('.row').hidden = true;   // 지형 선택은 숨김 (평지 고정)
  $('terrainHint').hidden = true;
  const lockMove = draft.mode === 'hide' || draft.mode === 'sign', lockSign = draft.mode === 'sign';
  document.querySelector('#menu .seg[data-key="move"]').classList.toggle('disabled', lockMove);
  document.querySelector('#menu .seg[data-key="terrain"]').classList.toggle('disabled', lockSign);   // 두 레인이 똑같도록 평지
  document.querySelector('#menu .seg[data-key="axis"]').classList.toggle('disabled', lockSign);      // 가로 접는 선 고정
  document.querySelector('#menu .seg[data-key="opp"] [data-v="pvp"]').hidden = lockMove ? true : false;
  $('terrainHint').textContent = { flat: '평평한 종이 · 공이 막히지 않아요',
    hill: '완만한 언덕 · 언덕이 앞을 가리면 공이 걸려요 (지형도 접는 선 기준으로 좌우 대칭)',
    mountain: '높은 산 · 자리 잡기가 중요해요 (좌우 대칭)' }[draft.terrain];
  $('mapHint').textContent = `${Mp.w} × ${Mp.d}m · 넓을수록 대칭 가늠이 어렵고 바람도 오래 타요`;
  const score = { big: 0, normal: 1, small: 2 }[draft.bomb] + { off: 0, weak: 1, normal: 2, strong: 3 }[draft.wind]
    + { small: 0, normal: 1, large: 2 }[draft.map] + { flat: 0, hill: 1, mountain: 2 }[draft.terrain];
  const stars = 1 + Math.round(score * 4 / 9);
  $('diffMeter').innerHTML = `판 난이도 <b>${'★'.repeat(stars)}${'☆'.repeat(5 - stars)}</b>`;
  $('closeMenuBtn').hidden = !gameActive();
}

function openMenu() {
  menuOpen = true;
  draft = { ...settings };
  $('over').hidden = true;
  $('menu').hidden = false;
  renderMenu();
}
function closeMenu() {
  menuOpen = false;
  $('menu').hidden = true;
}

$('menu').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const seg = b.closest('.seg');
  if (seg?.dataset.key) draft[seg.dataset.key] = b.dataset.v;
  else if (seg?.id === 'presetSeg') Object.assign(draft, QUICK[b.dataset.p]);
  else return;
  if ((draft.mode === 'hide' || draft.mode === 'sign') && draft.opp === 'pvp') draft.opp = 'ai';   // 한 화면에선 상대를 못 숨기고 동시에 조작도 못 함
  renderMenu();
});
$('startBtn').onclick = () => {
  sfx.unlock();
  if (draft.opp === 'online') return;   // 온라인은 친구가 들어오면 자동 시작
  netClose();
  Object.assign(settings, draft);
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
  closeMenu();
  newGame();
};
$('closeMenuBtn').onclick = closeMenu;
$('settingsBtn').onclick = openMenu;
$('overSettingsBtn').onclick = openMenu;
$('viewBtn').onclick = () => {
  view = view === 'tilt' ? 'top' : 'tilt';
  $('viewBtn').textContent = view === 'tilt' ? '위에서 보기' : '기울여 보기';
  fitCamera();
};
$('soundBtn').onclick = () => {
  sfx.unlock();
  $('soundBtn').textContent = sfx.toggle() ? '소리 꺼짐' : '소리 켜짐';
};

// ================= 매 프레임 =================
let last = performance.now();
const tmpV = new THREE.Vector3();

function updateChars(now, dt) {
  for (const ch of players) {
    const foe = players[1 - ch.zone];
    // 온라인: 친구가 끄는 위치를 부드럽게 따라감
    if (ch.netPos && (phase === 'remote' && ch.zone === turn || MODE === 'sign' && ch.zone !== turn)) {
      const k = 1 - Math.exp(-14 * dt);
      ch.pos.x += (ch.netPos.x - ch.pos.x) * k;
      ch.pos.z += (ch.netPos.z - ch.pos.z) * k;
    }
    if (MODE !== 'sign' && !((phase === 'aim' || phase === 'ai' || phase === 'remote') && ch.zone === turn) && phase !== 'flight' && phase !== 'fold' && foe) {
      const dx = foe.pos.x - ch.pos.x, dz = foe.pos.z - ch.pos.z, l = Math.hypot(dx, dz) || 1;
      if (phase !== 'relocate') ch.faceTarget = Math.atan2(dx / l, dz / l + 0.9);
    }
    ch.rig.rotation.y = lerpAngle(ch.rig.rotation.y, ch.faceTarget, 1 - Math.exp(-10 * dt));

    const breath = ch.flat ? 0 : Math.sin(now * 0.004 + ch.zone * 2) * 0.03;
    const wide = 1 + (1 - ch.sq) * 0.7;
    ch.rig.scale.set(wide * (1 - breath * 0.4), ch.sq * (1 + breath), wide * (1 - breath * 0.4));

    let y = ch.hopY, sx = 0;
    if (ch.winner) y = Math.abs(Math.sin(now * 0.008)) * 0.8;
    const hk = 1 - (now - ch.hurtT) / 600;
    if (hk > 0) {
      sx = Math.sin(now * 0.09) * 0.1 * hk;
      const f = Math.sin(now * 0.05) > 0 ? hk * 0.9 : 0;
      ch.mats.forEach(m => m.emissive.setScalar(f));
    } else ch.mats.forEach(m => m.emissive.setScalar(0));
    ch.root.position.set(ch.pos.x + sx, y + terrainH(ch.pos.x, ch.pos.z), ch.pos.z);
    ch.root.visible = !hiddenFrom(ch);   // 숨바꼭질: 상대는 안 보임

    if (ch.flat) ch.eyes.scale.y = 0.12;
    else if (now > ch.blinkAt) {
      ch.eyes.scale.y = 0.1;
      if (now > ch.blinkAt + 110) { ch.eyes.scale.y = 1; ch.blinkAt = now + rand(1800, 4500); }
    }
    ch.tag.position.y = 0.45 + 2.2 * ch.sq;
    if (ch.mixer) {   // 모델 캐릭터: 움직이는 동안만 걷기 애니메이션
      const lp = ch.lastPos || ch.pos, sp = dt > 0 ? Math.hypot(ch.pos.x - lp.x, ch.pos.z - lp.z) / dt : 0;
      ch.lastPos = { ...ch.pos };
      ch.walkW += ((sp > 0.4 && !ch.flat ? 1 : 0) - ch.walkW) * (1 - Math.exp(-8 * dt));
      ch.walk.setEffectiveWeight(ch.walkW);
      ch.mixer.update(dt);
    }
    ch.ring.scale.setScalar(1 + Math.sin(now * 0.006) * 0.08);
  }
}

function updateWind(now, dt) {
  const wv = windVec();
  const yawTarget = Math.atan2(-Math.sin(wind.angle), Math.cos(wind.angle));
  windsock.yaw.rotation.y = lerpAngle(windsock.yaw.rotation.y, yawTarget, 1 - Math.exp(-3 * dt));
  const droop = (1 - wind.str / 5) * 1.25;
  const wob = Math.sin(now * 0.008 * (1 + wind.str * 0.4)) * 0.03 * (wind.str + 1);
  windsock.pitch.rotation.z += (-droop + wob - windsock.pitch.rotation.z) * (1 - Math.exp(-4 * dt));
  windsock.pitch.rotation.x = Math.sin(now * 0.011) * 0.05 * wind.str;

  const op = Math.min(0.75, wind.str * 0.16);
  for (const s of streaks) {
    const sp = (1.2 + wind.str * 1.6) * s.userData.speed;
    s.position.x += wv.x / (wind.str || 1) * sp * dt;
    s.position.z += wv.z / (wind.str || 1) * sp * dt;
    if (s.position.x > 12) s.position.x -= 24; if (s.position.x < -12) s.position.x += 24;
    if (s.position.z > 9) s.position.z -= 18; if (s.position.z < -9) s.position.z += 18;
    s.rotation.y = yawTarget;
    s.material.opacity += (op - s.material.opacity) * (1 - Math.exp(-3 * dt));
  }
  for (const c of clouds) {
    c.position.x += (0.25 + wv.x * 0.25) * dt;
    c.position.z += wv.z * 0.12 * dt;
    if (c.position.x > 50) c.position.x -= 100; if (c.position.x < -50) c.position.x += 100;
    if (c.position.z > -10) c.position.z -= 34; if (c.position.z < -44) c.position.z += 34;
  }
}

function updateParticles(now, dt) {
  drops = drops.filter(d => {
    const k = (now - d.t0) / 380;
    if (k >= 1) { remT(d.m); return false; }
    d.m.scale.setScalar(1 - k);
    return true;
  });
  confetti = confetti.filter(m => {
    const u = m.userData;
    if (now - u.t0 > 7000) { remT(m); return false; }
    const floor = terrainH(m.position.x, m.position.z) + 0.03;
    if (m.position.y > floor) {
      u.v.y -= 14 * dt; u.v.multiplyScalar(0.985);
      m.position.addScaledVector(u.v, dt);
      m.rotation.x += u.r.x * dt; m.rotation.y += u.r.y * dt; m.rotation.z += u.r.z * dt;
      const f2 = terrainH(m.position.x, m.position.z) + 0.03;
      if (m.position.y < f2) { m.position.y = f2; m.rotation.x = -Math.PI / 2; m.rotation.y = 0; }
    }
    return true;
  });
  const r = canvas.getBoundingClientRect();
  floaters = floaters.filter(f => {
    if (now - f.t0 > 1700) { f.el.remove(); return false; }
    tmpV.copy(f.pos).project(camBaseCam);
    f.el.style.left = ((tmpV.x + 1) / 2 * r.width) + 'px';
    f.el.style.top = ((1 - tmpV.y) / 2 * r.height) + 'px';
    return true;
  });
}

function frame() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  runTweens(now);
  updateChars(now, dt);
  updateWind(now, dt);
  updateAim(now);
  updateMoveArea();
  updateParticles(now, dt);
  raceTick(now);
  netTick(now);

  camera.position.copy(camBaseCam.position);
  if (shake > 0.001) {
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake;
    shake *= Math.pow(0.02, dt);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// 디버그/자동 테스트용 조회 훅
window.__decal = {
  state: () => ({ mode: MODE, axis, turn, phase, move: moveMode(),
    sign: MODE === 'sign' ? { n: sign.n, idx: [...sign.idx], miss: [...sign.miss], shots: [...sign.shots], fin: [...sign.fin], done: [...sign.done], on: raceOn,
      target: [signTarget(0), signTarget(1)], winds: sign.winds } : null,
    hide: MODE === 'hide' ? { paints: paints.length, last: hideLast, shots: [...hideShots], hidden: players.map(hiddenFrom) } : null,
    omok: MODE === 'omok' ? { g: omok.g, cols: omok.xs.length, rows: omok.zs.length, shots: omok.shots,
      grid: omok.grid.map(c => c.join(',')), longest: [omokLongest(0), omokLongest(1)] } : null,
    dice: MODE === 'dice' && dice.own ? { cols: dice.cols, rows: dice.rows, own: [...dice.own], count: [...dice.count], pct: [dicePct(0), dicePct(1)], shots: [...dice.shots] } : null, moveR: moveR(), wind: { ...wind },
    net: { me: net.me, host: net.host, connected: !!net.conn, code: net.code },
    players: players.map(p => ({ ...p.pos, hp: p.hp, from: p.moveFrom })) }),
  terrainH, lastShot: () => lastShot, terrainTop: () => terrainTop,
  // 이 자리에서 저 자리를 바람 없이 쏘면 언덕에 막히는가
  blocked(px, pz, ax, az) {
    const me = { pos: { x: px, z: pz } }, S = gunTip(me, Math.atan2(ax - px, az - pz));
    const d = Math.hypot(ax - S.x, az - S.z), a = { x: ax, z: az };
    return traceFlight(S, a, a, d).blocked;
  },
  toScreen(x, z, y = terrainH(x, z)) {
    tmpV.set(x, y, z).project(camBaseCam);
    const r = canvas.getBoundingClientRect();
    return { x: (tmpV.x + 1) / 2 * r.width, y: (1 - tmpV.y) / 2 * r.height };
  },
  // AI 밸런스 확인: 현재 판 설정에서 AI 실력별 명중률 시뮬레이션 (애니메이션 없음)
  aiStats(level, n = 2000) {
    const saved = { ai: settings.ai, wind: { ...wind } };
    settings.ai = level;
    const r = { core: 0, edge: 0, miss: 0, out: 0, avgDmg: 0 };
    for (let i = 0; i < n; i++) {
      rollWind();
      const me = { zone: 1, pos: randomSpot(1) }, foe = { zone: 0, pos: randomSpot(0) };
      const plan = aiPlan(me, foe);
      const S = gunTip(me, Math.atan2(plan.x - me.pos.x, plan.z - me.pos.z));
      const d = Math.hypot(plan.x - S.x, plan.z - S.z), wv = windVec();
      const land = { x: plan.x + wv.x * DRIFT * d, z: plan.z + wv.z * DRIFT * d };
      if (!inZone(land, 1)) { r.out++; continue; }
      const mir = mirror(land), dist = Math.hypot(mir.x - foe.pos.x, mir.z - foe.pos.z);
      if (dist <= HIT_CORE) { r.core++; r.avgDmg += DMG_CORE; }
      else if (dist <= HIT_EDGE) { r.edge++; r.avgDmg += DMG_EDGE; }
      else r.miss++;
    }
    settings.ai = saved.ai; Object.assign(wind, saved.wind);
    for (const k of ['core', 'edge', 'miss', 'out']) r[k] = +(r[k] / n * 100).toFixed(1);
    r.avgDmg = +(r.avgDmg / n).toFixed(1);
    return r;
  },
  applySettings(s) { Object.assign(settings, s); applySettings(); },
};

// 타이틀에서 시작을 누르면 기존 설정 화면으로. 초기화 전 클릭도 타이틀의 hidden 상태로 기억.
let titleReady = false;
document.addEventListener('decal:start', () => {
  if (!titleReady) return;
  openMenu();
  $('menu').querySelector('button.on').focus({ preventScroll:true });
});

// 처음엔 판만 준비하고 타이틀에서 기다림 (초대 링크는 곧바로 참가).
Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(() => {
  applySettings();
  setTerrain([]);
  buildBoard();
  phase = 'menu';
  // 초대 링크(?room=코드)로 들어오면 바로 그 방에 참가
  const room = new URLSearchParams(location.search).get('room');
  if (room) settings.opp = 'online';
  updateHud();
  titleReady = true;
  if (room || $('titleScreen').hidden) openMenu();
  if (room) { $('codeIn').value = room.toUpperCase(); netJoin(room); }
  requestAnimationFrame(frame);
});
</script>
